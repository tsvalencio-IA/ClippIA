name: Coletar notícias Econoroeste

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rodar coletor
        run: python scripts/coletar_noticias.py

      - name: Salvar JSON no GitHub
        run: |
          git config user.name "clippia-bot"
          git config user.email "clippia-bot@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet && echo "Sem mudanças" || git commit -m "Atualiza notícias ClippIA"
          git push
